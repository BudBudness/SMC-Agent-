name: SMC Research Engine CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "app/**"
      - "api/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.ts"
      - "requirements.txt"
      - "src/**"
      - "scripts/build_research_report.py"
      - "tests/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "app/**"
      - "api/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.ts"
      - "requirements.txt"
      - "src/**"
      - "scripts/build_research_report.py"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -e ".[test]"
      - name: Python tests
        run: PYTHONPATH=. pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Node dependencies
        run: npm install
      - name: Production Next.js build
        run: npm run build
      - name: Start canonical research engine locally
        env:
          PYTHONPATH: .
        run: |
          nohup python -u -c "from http.server import HTTPServer; from api.research_engine import handler; HTTPServer(('127.0.0.1', 8765), handler).serve_forever()" >/tmp/smc-research-engine.log 2>&1 &
          echo $! >/tmp/smc-research-engine.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/ >/tmp/engine-ready.json; then break; fi
            sleep 2
          done
          python - <<'PY'
          import json
          payload=json.load(open("/tmp/engine-ready.json"))
          assert payload.get("status") == "READY", payload
          assert payload.get("execution") == "CANONICAL_PIPELINE", payload
          print("PASS: local canonical research engine readiness")
          PY
      - name: Execute parameterized research through local API
        run: |
          curl --fail --silent --show-error \
            -X POST http://127.0.0.1:8765/ \
            -H "Content-Type: application/json" \
            -d '{"instrument":"EURUSD","start":"2026-09-01T00:00:00Z","end":"2026-10-02T16:58:00Z","replay_bars":1000}' \
            -o /tmp/research-run.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/research-run.json"))
          assert x.get("execution") == "CANONICAL_PIPELINE", x
          assert x.get("parameters",{}).get("start") == "2026-09-01T00:00:00Z", x
          assert x.get("dataset_validation",{}).get("valid") is True, x
          assert x.get("mtf_validation",{}).get("valid") is True, x
          assert len(x.get("replay",[])) > 0, x
          assert x.get("benchmarks",{}).get("results"), x
          print("PASS: parameterized EURUSD research", x["source"]["rows_after_window"], "rows")
          PY
