name: Production dashboard validation
on:
  push:
    paths:
      - ".github/workflows/**"
      - "app/**"
      - "api/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.ts"
      - "vercel.json"
      - "requirements.txt"
      - "src/**"
      - "scripts/build_research_report.py"
      - "tests/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -e ".[test]"
      - name: Python tests
        run: PYTHONPATH=. pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Node dependencies
        run: npm install
      - name: Production Next.js build
        run: npm run build
      - name: End-to-end production research API
        run: |
          set -e
          for i in $(seq 1 12); do
            code=$(curl -sS -o /tmp/research.json -w "%{http_code}" https://smc-agent.vercel.app/api/research || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 10
          done
          test "$code" = "200"
          python - <<'PY2'
          import json
          x=json.load(open("/tmp/research.json"))
          assert x.get("report") and x.get("mtf"), x
          print("GET /api/research PASS")
          PY2
          curl -sS https://smc-agent.vercel.app/api/research_engine -o /tmp/engine-ready.json
          python - <<'PY2'
          import json
          x=json.load(open("/tmp/engine-ready.json"))
          assert x.get("status")=="READY", x
          assert x.get("execution")=="CANONICAL_PIPELINE", x
          print("GET /api/research_engine PASS")
          PY2
          curl -sS -X POST https://smc-agent.vercel.app/api/research             -H "Content-Type: application/json"             -d '{"action":"run","instrument":"EURUSD","parameters":{"start":"2026-09-01T00:00:00Z","end":"2026-10-02T16:58:00Z","replay_bars":1000}}'             -o /tmp/research-run.json
          python - <<'PY2'
          import json
          x=json.load(open("/tmp/research-run.json"))
          r=x.get("result",{})
          assert x.get("run",{}).get("status")=="COMPLETED", x
          assert r.get("execution")=="CANONICAL_PIPELINE", r
          assert r.get("parameters",{}).get("start")=="2026-09-01T00:00:00Z", r
          assert r.get("dataset_validation",{}).get("valid") is True, r
          assert r.get("mtf_validation",{}).get("valid") is True, r
          assert len(r.get("replay",[]))>0, r
          assert r.get("benchmarks",{}).get("results"), r
          print("POST /api/research parameterized canonical pipeline PASS", x["run"]["id"])
          PY2
