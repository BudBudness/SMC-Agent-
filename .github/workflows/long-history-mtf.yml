name: Long-history MTF reconstruction
# Optimized long-history research pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/long-history-mtf.yml"
      - "scripts/fetch_long_history.py"
      - "src/smc_agent/timeframes.py"
      - "src/smc_agent/providers.py"
      - "src/smc_agent/structure.py"
      - "scripts/evaluate_mtf_intelligence.py"
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: python -m pip install -e ".[test]" histdata-fetcher

      - name: Fetch EURUSD M1 history
        run: PYTHONPATH=src python scripts/fetch_long_history.py --start 2003-05-01 --end 2026-09-28 --out data/long_history/EURUSD_M1.csv

      - name: Validate long history
        run: PYTHONPATH=src python scripts/ingest_histdata.py data/long_history/EURUSD_M1.csv --out data/long_history/EURUSD_M1_normalized.csv

      - name: Build and validate MTF once
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          from smc_agent.providers import HistDataProvider
          from smc_agent.timeframes import reconstruct, coverage, ANALYSIS_TIMEFRAMES

          path="data/long_history/EURUSD_M1_normalized.csv"
          df=HistDataProvider(path).candles()
          frames=reconstruct(df)

          assert all(len(frames[x]) > 0 for x in ANALYSIS_TIMEFRAMES)
          assert all(frames[x].index.is_monotonic_increasing for x in ANALYSIS_TIMEFRAMES)
          assert all(frames[x].index.is_unique for x in ANALYSIS_TIMEFRAMES)
          assert len(frames["12M"]) >= 20
          assert len(frames["6M"]) >= 40
          assert len(frames["3M"]) >= 80

          result={
              "source_rows":len(df),
              "source_start":df.index[0].isoformat(),
              "source_end":df.index[-1].isoformat(),
              "coverage":coverage(frames),
              "validation":"PASS",
              "architecture":"single-load single-reconstruction"
          }
          print(json.dumps(result,indent=2))
          with open("data/long_history/mtf_coverage.json","w") as f:
              json.dump(result,f,indent=2)
          PY

      - name: Run substantive MTF intelligence evaluation
        run: PYTHONPATH=src python scripts/evaluate_mtf_intelligence.py data/long_history/EURUSD_M1_normalized.csv --out benchmark-results/mtf_substantive_evaluation.json

      - name: Run intelligence pipeline on recent analysis window
        run: |
          PYTHONPATH=src python - <<'PY'
          import pandas as pd
          from pathlib import Path
          src="data/long_history/EURUSD_M1_normalized.csv"
          out="data/long_history/EURUSD_M1_intelligence_window.csv"
          df=pd.read_csv(src,parse_dates=["timestamp"])
          df=df.sort_values("timestamp")
          cutoff=df["timestamp"].max()-pd.DateOffset(years=2)
          window=df[df["timestamp"]>=cutoff]
          window.to_csv(out,index=False)
          print({"source_rows":len(df),"analysis_rows":len(window),"window_start":window["timestamp"].min().isoformat(),"window_end":window["timestamp"].max().isoformat()})
          PY
          PYTHONPATH=src python scripts/run_intelligence.py data/long_history/EURUSD_M1_intelligence_window.csv

      - name: Build compact dashboard research dataset
        run: |
          PYTHONPATH=src python - <<'PY'
          import pandas as pd
          src="data/long_history/EURUSD_M1_normalized.csv"
          out="data/long_history/EURUSD_M1_dashboard.csv"
          df=pd.read_csv(src,parse_dates=["timestamp"])
          df=df.sort_values("timestamp")
          cutoff=df["timestamp"].max()-pd.DateOffset(days=90)
          window=df[df["timestamp"]>=cutoff]
          window.to_csv(out,index=False)
          print({"dashboard_rows":len(window),"start":window["timestamp"].min().isoformat(),"end":window["timestamp"].max().isoformat()})
          PY

      - name: Publish dashboard research dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gzip -c data/long_history/EURUSD_M1_normalized.csv > data/long_history/EURUSD_M1_normalized.csv.gz
          gzip -c data/long_history/EURUSD_M1_dashboard.csv > data/long_history/EURUSD_M1_dashboard.csv.gz
          gh release view research-data --repo "${{ github.repository }}" >/dev/null 2>&1 || gh release create research-data --repo "${{ github.repository }}" --title "Research dataset" --notes "Generated EUR/USD long-history research dataset for the Henryz SMC Intelligence dashboard." --latest=false
          gh release upload research-data data/long_history/EURUSD_M1_normalized.csv.gz --repo "${{ github.repository }}" --clobber
          gh release upload research-data data/long_history/EURUSD_M1_dashboard.csv.gz --repo "${{ github.repository }}" --clobber
          gh release upload research-data data/long_history/mtf_coverage.json --repo "${{ github.repository }}" --clobber
          gh release upload research-data benchmark-results/mtf_substantive_evaluation.json --repo "${{ github.repository }}" --clobber

      - name: Upload long-history research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eurusd-long-history-mtf
          path: |
            data/long_history/mtf_coverage.json
            benchmark-results/mtf_substantive_evaluation.json
