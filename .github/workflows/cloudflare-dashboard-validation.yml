name: Cloudflare dashboard validation

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "package.json"
      - "next.config.ts"
      - "wrangler.jsonc"
      - "cloudflare-env.d.ts"
      - ".github/workflows/cloudflare-dashboard-validation.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "package.json"
      - "next.config.ts"
      - "wrangler.jsonc"
      - "cloudflare-env.d.ts"
      - ".github/workflows/cloudflare-dashboard-validation.yml"

permissions:
  contents: read

jobs:
  cloudflare-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Cloudflare binding types
        run: npm run cf-typegen
      - name: Build OpenNext Cloudflare Worker
        run: npx opennextjs-cloudflare build
